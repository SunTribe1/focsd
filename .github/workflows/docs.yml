name: Docs

# Production (focsd.dev) deploys only after CI has passed on a push to main, so a red commit never goes
# live. Pull requests get a preview URL straight away; CI still gates their merge.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event_name == 'workflow_run' && 'production' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Production: a push to this repository's main that CI passed, still the tip of main. Previews: pull
    # requests from this repository (forks and Dependabot get no secrets; CI covers them).
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_sha == github.sha) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit CI tested, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@focsd-dev/docs
      # main deploys to production (focsd.dev); pull requests get a preview URL. Wrangler runs from npm,
      # pinned, outside the repository: cloudflare/wrangler-action installs it with `pnpm add` at the
      # workspace root, which pnpm refuses. 3.114 (npm's "legacy" line) deploys straight to Pages.
      - name: Deploy to Cloudflare Pages
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || (github.event_name == 'workflow_dispatch' && github.ref_name) || 'main' }}
          DIST: ${{ github.workspace }}/apps/docs/dist
        run: npx --yes wrangler@3.114.17 pages deploy "$DIST" --project-name=focsd --branch="$BRANCH"
