name: CI

# How much runs (see "What runs when" in CONTRIBUTING.md):
#   pull request   lint, types and unit tests of the affected packages; browser jobs in Chromium only,
#                  and only when the change touches code the browsers test
#   push to main   lint, types, all unit tests and packaging: the pull request already ran the rest on
#                  the same tree (branch protection requires it to be up to date), so releases are quick
#   full           every job in every engine, with coverage: nightly, on demand, and on the "Version
#                  packages" pull request, so nothing is published without the full suite
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      browsers: ${{ steps.plan.outputs.browsers }}
      docs: ${{ steps.plan.outputs.docs }}
      engines: ${{ steps.plan.outputs.engines }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-plan.mjs >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Free for personal accounts; an organisation needs GITLEAKS_LICENSE (see RELEASING.md).
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pull requests merge as one squash commit named after the title, so the title and every commit
    # must follow Conventional Commits (commitlint.config.js).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint
      - name: Commits in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD"

  check:
    name: Lint, types, unit tests and size budgets
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # turbo --affected compares the pull request with its base branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm check reads the built custom-elements manifests (the docs catalogue, the screen-reader
      # checklist, the lit analyzer), which are build output and not committed.
      - run: pnpm exec turbo run build --filter="./packages/*"
      - run: pnpm check
      # Nothing published may depend on a package with a known vulnerability.
      - run: pnpm audit --prod --audit-level=low
      # The CLI's smoke test renders a copied component in Chromium.
      - run: pnpm --filter ./packages/cli exec playwright install --with-deps chromium
      # Two packages at a time: the timing tests (chart render cost, data grid pipeline) starve when
      # every package's suite shares the runner's four cores at once.
      # On a pull request, only the packages it changes and the packages that depend on them.
      - name: Unit tests
        env:
          AFFECTED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.full != 'true' && '--affected' || '' }}
        run: pnpm exec turbo run test --filter="./packages/*" --concurrency=2 $AFFECTED
      # The docs site's own unit tests (CSP hashes, sandboxes) are plain node:test files.
      - run: pnpm --filter @focsd-dev/docs test

  visual:
    name: Visual regression (Chromium, Linux baselines)
    # The browser jobs start only once lint, types and unit tests pass: a failure there means a fix
    # and a new run anyway. They run only when the change touches what they test.
    needs: [changes, check]
    if: needs.changes.outputs.browsers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same image as the "Update visual baselines" workflow, so the screenshots match pixel for pixel.
    container:
      # v1.63.0-noble (multi-arch index digest); matches @playwright/test 1.63.0.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Chromium runs out of shared memory in a container without the host's IPC namespace.
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Missing baselines fail the job: a skipped visual job would pass with nothing compared.
      - name: Require the Linux baselines
        shell: bash
        run: |
          if ! compgen -G 'apps/playground/e2e/__screenshots__/linux/*.png' > /dev/null; then
            echo "::error::No Linux visual baselines are committed. Run Actions → Update visual baselines on this pull request's branch. Without RELEASE_TOKEN its commit starts no CI: push an empty commit (git commit --allow-empty) or close and reopen the PR. Re-running this job only re-tests the old commit."
            exit 1
          fi
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter="./packages/*"
      # The image already has the Playwright 1.63.0 browsers.
      - run: pnpm --filter @focsd-dev/playground test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-diffs
          path: apps/playground/test-results

  coverage:
    name: End-to-end coverage of the packages (Chromium)
    # About 35 minutes, so only on a full run (nightly and the Version packages pull request).
    needs: [changes, check]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # About 30 minutes on a hosted runner with coverage on; the limit leaves headroom.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter="./packages/*"
      - run: pnpm --filter @focsd-dev/playground exec playwright install --with-deps chromium
      - run: pnpm --filter @focsd-dev/playground coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-coverage
          path: apps/playground/coverage

  playground:
    name: Components in ${{ matrix.label }}
    needs: [changes, check]
    if: needs.changes.outputs.browsers == 'true'
    runs-on: ubuntu-latest
    # One job per engine, in parallel: the three together (about 5,700 tests) ran past an hour. One
    # engine takes 20 to 45 minutes depending on the runner, so the limit leaves headroom.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Chromium on a pull request; Chromium, Firefox and WebKit on a full run (scripts/ci-plan.mjs).
        include: ${{ fromJSON(needs.changes.outputs.engines) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter="./packages/*"
      - run: pnpm --filter @focsd-dev/playground exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @focsd-dev/playground exec playwright test ${{ matrix.projects }}
      # The token output (themes, densities, forced colours) in the same engine.
      - run: pnpm --filter @focsd-dev/tokens test:e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playground-report-${{ matrix.browser }}
          path: apps/playground/test-results
          retention-days: 7

  smoke:
    name: Packed install and SSR hydration (Chromium)
    needs: [changes, check]
    if: needs.changes.outputs.browsers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter="./packages/*"
      - run: pnpm --filter @focsd-dev/playground exec playwright install --with-deps chromium
      # Pack once, then install the tarballs twice: offline (links the monorepo's third-party deps)
      # and online (third-party deps from the registry, @focsd-dev/* overridden to the local tarballs).
      - run: node scripts/smoke/consumer.mjs --offline --online
      # publint and Are the Types Wrong? on the packed tarballs.
      - run: node scripts/check-packages.mjs
      - run: pnpm --filter @focsd-dev/playground exec playwright test --project=chromium e2e/ssr-hydrate.spec.js

  docs:
    name: Docs site
    needs: [changes, check]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @focsd-dev/docs exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @focsd-dev/docs test:e2e

  # The one check branch protection requires. Jobs that the plan skips count as passed; a failed or
  # cancelled one fails this, so a pull request cannot merge past it.
  result:
    name: CI result
    needs: [changes, secrets, commits, check, visual, coverage, playground, smoke, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::A CI job failed or was cancelled."
            exit 1
          fi
