packages:
  - 'packages/*'
  - 'apps/*'
# Install scripts are opt-in. rs-module-lexer (via @custom-elements-manifest/analyzer) ships
# prebuilt native binaries as optional dependencies, so its postinstall is not needed.
allowBuilds:
  rs-module-lexer: false
  # esbuild (via Astro/Vite) also ships its platform binary as an optional dependency.
  esbuild: false
  # unrs-resolver (via eslint-plugin-import-x) ships its binary as an optional dependency too.
  unrs-resolver: false
patchedDependencies:
  starlight-theme-black@0.7.1: patches/starlight-theme-black@0.7.1.patch

# Security fixes for transitive dependencies (pnpm audit): patched versions within the same major
# where one exists; postcss-selector-parser's fix is only in 7.x (used by the docs' code blocks).
# braces (GHSA, dev-only via @custom-elements-manifest/analyzer → chokidar) has no published fix;
# see .github/audit-exceptions.md.
overrides:
  http-cache-semantics: ^4.2.1
  postcss-selector-parser: ^7.1.6
  # typescript-eslint pins for the lint plugins (eslint-plugin-import-x and @vitest/eslint-plugin
  # would otherwise pull a release younger than the two-week dependency age rule).
  '@typescript-eslint/utils': 8.72.1
  '@vitest/eslint-plugin>@typescript-eslint/scope-manager': 8.72.1
  # The language server under @astrojs/check (docs), held to releases older than two weeks.
  'vscode-jsonrpc@10.0.1': 10.0.0
  'vscode-languageserver-protocol@3.18.6': 3.18.5
  'vscode-languageserver-types@3.18.6': 3.18.5
